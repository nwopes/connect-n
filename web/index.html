<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect-N vs the Bots</title>
<style>
  :root {
    --navy: #1B2A4A; --board: #2F4C7E; --hole: #142039; --red: #D3243A; --gold: #E8A90C;
    --ink: #E9EDF5; --muted: #9AA6BD; --panel: #22335A; --line: #34497A;
    --cell: min(11vw, 74px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--navy); color: var(--ink);
    font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif; }
  ::selection { background: var(--gold); color: var(--navy); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 40px; display: grid;
    grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 16px; }

  /* board */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #status { min-height: 34px; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  #status .chip { width: 20px; height: 20px; border-radius: 50%; display: inline-block; }
  .boardwrap { position: relative; padding: calc(var(--cell) * 0.12); background: var(--board);
    border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  #board { display: grid; position: relative; }
  .col { display: flex; flex-direction: column-reverse; cursor: pointer; border-radius: 12px; }
  .col:hover, .col.focus { background: rgba(255,255,255,.07); }
  .locked .col { cursor: default; }
  .locked .col:hover { background: none; }
  .cell { width: var(--cell); height: var(--cell); display: grid; place-items: center; }
  .hole { width: 80%; height: 80%; border-radius: 50%; background: var(--hole);
    box-shadow: inset 0 3px 6px rgba(0,0,0,.45); position: relative; overflow: visible; }
  .disc { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
  .disc.p0 { background: var(--red); } .disc.p1 { background: var(--gold); }
  .disc.drop { animation: drop var(--dur, 380ms) cubic-bezier(.55,0,1,.45) both, settle 160ms ease-out var(--dur, 380ms); }
  @keyframes drop { from { transform: translateY(var(--from)); } to { transform: translateY(0); } }
  @keyframes settle { 50% { transform: translateY(-6%); } }
  .disc.win::after { content: ""; position: absolute; inset: 32%; border-radius: 50%; background: #fff; }
  .disc.last { outline: 3px solid rgba(255,255,255,.55); outline-offset: 2px; }
  .ghost { position: absolute; inset: 0; border-radius: 50%; opacity: .28; }
  .labels { display: grid; color: var(--muted); font-size: 13px; text-align: center; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* side panel */
  aside { display: flex; flex-direction: column; gap: 18px; }
  section { background: var(--panel); border-radius: 14px; padding: 16px 18px; }
  section h2 { margin: 0 0 12px; font-size: 17px; font-weight: 600; color: var(--ink); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  select, input { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--navy);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  select:focus, input:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .players { display: grid; grid-template-columns: 22px 1fr; gap: 8px 10px; align-items: center; }
  .dot { width: 20px; height: 20px; border-radius: 50%; }
  button { font: inherit; font-size: 15px; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 16px;
    cursor: pointer; background: var(--gold); color: var(--navy); }
  button.ghostbtn { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .modes button { padding: 8px 6px; font-size: 14px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .modes button.on { background: var(--gold); color: var(--navy); border-color: var(--gold); }
  .about { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 8px 0 0; }

  /* bot's view */
  #view .note { font-size: 14px; line-height: 1.45; margin: 0 0 10px; }
  #view .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .bars { display: grid; gap: 5px; }
  .bar { display: grid; grid-template-columns: 34px 1fr 78px; align-items: center; gap: 8px; font-size: 13px; }
  .bar .track { height: 12px; background: var(--navy); border-radius: 6px; overflow: hidden; }
  .bar .fill { height: 100%; background: #5B78B0; border-radius: 6px; }
  .bar.chosen .fill { background: var(--gold); }
  .bar.chosen { font-weight: 600; }
  .bar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .bar.chosen .v { color: var(--ink); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .thinking { display: inline-flex; gap: 4px; }
  .thinking i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: pulse 1s infinite ease-in-out; }
  .thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .disc.drop { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Connect-N vs the Bots</h1>
    <p>Play the seven algorithms from the tournament. Click a column (or press 1-9) to drop a piece.</p>
  </header>

  <div class="stage">
    <div id="status" aria-live="polite"></div>
    <div class="boardwrap"><div id="board" role="grid" aria-label="Game board"></div></div>
    <div class="labels" id="labels"></div>
    <div class="controls">
      <button id="newBtn">New game</button>
      <button id="undoBtn" class="ghostbtn">Undo</button>
      <button id="hintBtn" class="ghostbtn">Ask Alpha-Beta for a hint</button>
      <button id="pauseBtn" class="ghostbtn" hidden>Pause</button>
    </div>
  </div>

  <aside>
    <section>
      <h2>Players</h2>
      <div class="modes" role="group" aria-label="Game mode">
        <button data-mode="hvb">You vs bot</button>
        <button data-mode="bvb">Bot vs bot</button>
        <button data-mode="hvh">2 players</button>
      </div>
      <div class="players">
        <span class="dot" style="background:var(--red)"></span>
        <select id="p0" aria-label="Red player"></select>
        <span class="dot" style="background:var(--gold)"></span>
        <select id="p1" aria-label="Gold player"></select>
      </div>
      <p class="about" id="about"></p>
      <label for="preset">Board</label>
      <select id="preset">
        <option value="6,7,4">Connect 4 - 6 rows x 7 columns</option>
        <option value="8,9,5">Connect 5 - 8 rows x 9 columns</option>
        <option value="5,6,3">Connect 3 - 5 rows x 6 columns</option>
        <option value="custom">Custom...</option>
      </select>
      <div class="row" id="customRow" hidden>
        <div><label for="rows">Rows</label><input id="rows" type="number" min="3" max="10" value="6"></div>
        <div><label for="cols">Columns</label><input id="cols" type="number" min="3" max="10" value="7"></div>
        <div><label for="nIn">N in a row</label><input id="nIn" type="number" min="3" max="8" value="4"></div>
      </div>
      <label for="speed">Bot vs bot speed</label>
      <select id="speed">
        <option value="250">Fast</option>
        <option value="700" selected>Normal</option>
        <option value="1500">Slow (for explaining)</option>
      </select>
    </section>

    <section id="view">
      <h2>What the bot is thinking</h2>
      <div id="viewBody"><p class="about">The last bot move's reasoning shows up here.</p></div>
    </section>
  </aside>
</div>

<script src="engine.js"></script>
<script>
(() => {
  const { Board, BOTS, think, ensureQ } = window.ConnectN;
  const $ = (id) => document.getElementById(id);
  const PLAYERS = [["human", "Human"], ...Object.entries(BOTS).map(([k, v]) => [k, v.name])];
  for (const id of ["p0", "p1"]) $(id).innerHTML = PLAYERS.map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
  $("p0").value = "human"; $("p1").value = "alphabeta";
  const COLOR = ["Red", "Gold"], CSSV = ["var(--red)", "var(--gold)"];

  // AI runs in a Web Worker so the page never freezes; falls back to the main thread (e.g. opened as a file).
  let worker = null, pending = new Map(), reqId = 0;
  try {
    worker = new Worker("engine.js");
    worker.onmessage = (e) => { const p = pending.get(e.data.id); if (p) p(e.data); };
    worker.onerror = () => { worker = null; };
  } catch (_) { worker = null; }
  function ask(bot, onProgress) {
    const id = ++reqId;
    const msg = { id, bot, rows: cfg.rows, cols: cfg.cols, n: cfg.n, history: board.history.slice() };
    return new Promise((resolve, reject) => {
      if (worker) {
        pending.set(id, (d) => {
          if (d.type === "progress") return onProgress && onProgress(d);
          pending.delete(id);
          d.type === "error" ? reject(new Error(d.message)) : resolve({ id, ...d.result });
        });
        worker.postMessage(msg);
      } else {
        setTimeout(() => {
          try { if (bot === "qlearning") ensureQ(cfg.rows, cfg.cols, cfg.n); resolve({ id, ...think(msg) }); }
          catch (err) { reject(err); }
        }, 30);
      }
    });
  }

  let cfg, board, over = false, busy = false, gameId = 0, hoverCol = null, paused = false;
  const players = () => [$("p0").value, $("p1").value];

  function newGame() {
    gameId++; busy = false; over = false;
    const v = $("preset").value;
    let [r, c, n] = v === "custom" ? [+$("rows").value, +$("cols").value, +$("nIn").value] : v.split(",").map(Number);
    r = Math.min(10, Math.max(3, r || 6)); c = Math.min(10, Math.max(3, c || 7)); n = Math.min(Math.max(r, c), Math.max(3, n || 4));
    cfg = { rows: r, cols: c, n };
    board = new Board(r, c, n);
    document.documentElement.style.setProperty("--cell", `min(${Math.floor(78 / c)}vw, ${c > 8 ? 62 : 74}px)`);
    buildBoard();
    $("viewBody").innerHTML = `<p class="about">The last bot move's reasoning shows up here.</p>`;
    render();
    step();
  }

  function buildBoard() {
    const el = $("board");
    el.style.gridTemplateColumns = `repeat(${cfg.cols}, var(--cell))`;
    $("labels").style.gridTemplateColumns = `repeat(${cfg.cols}, var(--cell))`;
    $("labels").innerHTML = [...Array(cfg.cols).keys()].map((c) => `<span>${c + 1}</span>`).join("");
    el.innerHTML = "";
    for (let c = 0; c < cfg.cols; c++) {
      const col = document.createElement("div");
      col.className = "col"; col.dataset.c = c;
      col.setAttribute("role", "button"); col.setAttribute("aria-label", `Column ${c + 1}`);
      for (let r = 0; r < cfg.rows; r++) col.insertAdjacentHTML("beforeend", `<div class="cell"><div class="hole" id="h${r}_${c}"></div></div>`);
      col.addEventListener("click", () => humanMove(c));
      col.addEventListener("mouseenter", () => { hoverCol = c; renderGhost(); });
      col.addEventListener("mouseleave", () => { hoverCol = null; renderGhost(); });
      el.appendChild(col);
    }
  }

  function isHumanTurn() { return !over && players()[board.player] === "human"; }

  function render(animateCol = null) {
    const line = board.lastMoverWon() ? board.winningLine() : null;
    const winSet = new Set((line || []).map(([r, c]) => `${r}_${c}`));
    const last = board.history.length ? board.history[board.history.length - 1] : null;
    for (let c = 0; c < cfg.cols; c++) for (let r = 0; r < cfg.rows; r++) {
      const hole = $(`h${r}_${c}`), v = board.grid[r * cfg.cols + c];
      hole.innerHTML = "";
      if (v >= 0) {
        const d = document.createElement("div");
        d.className = `disc p${v}` + (winSet.has(`${r}_${c}`) ? " win" : "") + (c === last && r === board.heights[c] - 1 && !line ? " last" : "");
        if (c === animateCol && r === board.heights[c] - 1) {
          const fall = cfg.rows - r;
          d.classList.add("drop");
          d.style.setProperty("--from", `${-fall * 125}%`);
          d.style.setProperty("--dur", `${180 + fall * 45}ms`);
        }
        hole.appendChild(d);
      }
    }
    $("board").parentElement.classList.toggle("locked", !isHumanTurn() || busy);
    const p = board.player, who = players();
    let s;
    if (line) { const w = 1 - p; s = `<span class="chip" style="background:${CSSV[w]}"></span>${COLOR[w]} (${label(who[w])}) wins in ${board.moves} moves!`; }
    else if (board.isFull()) s = "Draw - the board is full.";
    else if (who[p] === "human") s = `<span class="chip" style="background:${CSSV[p]}"></span>${COLOR[p]} to move - your turn`;
    else s = `<span class="chip" style="background:${CSSV[p]}"></span>${label(who[p])} is thinking <span class="thinking"><i></i><i></i><i></i></span>`;
    $("status").innerHTML = s;
    $("undoBtn").disabled = !board.moves;
    $("hintBtn").disabled = !isHumanTurn() || busy;
    const bvb = who.every((k) => k !== "human");
    $("hintBtn").hidden = bvb;
    $("pauseBtn").hidden = !bvb || over;
    $("pauseBtn").textContent = paused ? "Resume" : "Pause";
    const mode = bvb ? "bvb" : who.every((k) => k === "human") ? "hvh" : "hvb";
    document.querySelectorAll(".modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
    if (paused && !over && bvb) $("status").innerHTML = "Paused - press Resume to continue";
    const bot = who.find((k) => k !== "human");
    $("about").textContent = bot ? `${BOTS[bot].name}: ${BOTS[bot].about}` : "Two humans: pass the mouse back and forth.";
    renderGhost();
  }
  const label = (k) => (k === "human" ? "Human" : BOTS[k].name);

  function renderGhost() {
    document.querySelectorAll(".ghost").forEach((g) => g.remove());
    if (hoverCol === null || !isHumanTurn() || busy || !board.canPlay(hoverCol)) return;
    const r = board.heights[hoverCol];
    $(`h${r}_${hoverCol}`).insertAdjacentHTML("beforeend", `<div class="ghost" style="background:${CSSV[board.player]}"></div>`);
  }

  function applyMove(c) {
    board.play(c);
    if (board.lastMoverWon() || board.isFull()) over = true;
    render(c);
  }

  function humanMove(c) {
    if (!isHumanTurn() || busy || !board.canPlay(c)) return;
    applyMove(c);
    step();
  }

  async function step() {
    if (over || paused) return;
    const bot = players()[board.player];
    if (bot === "human") return;
    const g = gameId; busy = true; render();
    const bothBots = players().every((k) => k !== "human");
    const t0 = performance.now();
    try {
      const res = await ask(bot, (d) => {
        $("status").innerHTML = `Q-Learning is training: ${Math.round(d.pct * 100)}% of 50,000 self-play games (${d.size.toLocaleString()} positions)`;
      });
      const minDelay = bothBots ? +$("speed").value : 350;
      const wait = Math.max(0, minDelay - (performance.now() - t0));
      await new Promise((r) => setTimeout(r, wait));
      if (g !== gameId) return;
      busy = false;
      showView(bot, res, board.player);
      applyMove(res.col);
      step();
    } catch (err) {
      busy = false; $("status").textContent = "Bot error: " + err.message;
    }
  }

  function fmtScore(v, bot) {
    if (v === null || v === undefined) return "-";
    if (bot === "minimax" || bot === "alphabeta" || bot === "hint") {
      if (v >= 900000) return "wins";
      if (v <= -900000) return "loses";
      return v.toLocaleString();
    }
    if (bot === "montecarlo" || bot === "mcts") return v.toFixed(1) + "%";
    return String(v);
  }

  function showView(bot, res, player, title) {
    const name = title || `${BOTS[bot].name} played column ${res.col + 1}`;
    let html = `<p class="note"><strong>${name}.</strong> ${res.note || ""}</p>`;
    if (res.scores) {
      const vals = res.scores.filter((v) => v !== null);
      const clamp = (v) => Math.max(-5000, Math.min(5000, v));
      const lo = Math.min(...vals.map(clamp)), hi = Math.max(...vals.map(clamp));
      const maxVisits = res.visits ? Math.max(...res.visits.filter((v) => v !== null)) : 0;
      html += `<div class="label">${res.label || ""}</div><div class="bars">`;
      res.scores.forEach((v, c) => {
        let w = 0;
        if (v !== null) w = res.visits ? (res.visits[c] / maxVisits) * 100 : hi === lo ? 100 : 8 + 92 * (clamp(v) - lo) / (hi - lo);
        html += `<div class="bar ${c === res.col ? "chosen" : ""}"><span>Col ${c + 1}</span>
          <div class="track"><div class="fill" style="width:${w}%"></div></div><span class="v">${fmtScore(v, bot)}</span></div>`;
      });
      html += `</div>`;
    }
    const st = res.stats || {};
    const bits = [`${res.ms < 10 ? res.ms.toFixed(1) : Math.round(res.ms)} ms`];
    if (st.nodes) bits.push(`${st.nodes.toLocaleString()} positions searched`);
    if (st.playouts) bits.push(`${st.playouts.toLocaleString()} random games`);
    if (st.simulations) bits.push(`${st.simulations.toLocaleString()} simulations`);
    if (res.tableSize) bits.push(`${res.tableSize.toLocaleString()} positions in its table`);
    html += `<div class="meta">${bits.join(" · ")}</div>`;
    $("viewBody").innerHTML = html;
  }

  $("hintBtn").addEventListener("click", async () => {
    if (!isHumanTurn() || busy) return;
    busy = true; render();
    $("status").innerHTML = `Alpha-Beta is looking for a hint <span class="thinking"><i></i><i></i><i></i></span>`;
    const res = await ask("alphabeta");
    busy = false;
    showView("hint", res, board.player, `Hint: Alpha-Beta would play column ${res.col + 1}`);
    render();
    hoverCol = res.col; renderGhost();
  });

  $("undoBtn").addEventListener("click", () => {
    if (!board.moves) return;
    gameId++; busy = false; over = false;
    board.undo();
    // in human-vs-bot, step back to the human's turn
    while (board.moves && players()[board.player] !== "human" && players().includes("human")) board.undo();
    render(); step();
  });
  $("newBtn").addEventListener("click", () => { paused = false; newGame(); });
  $("pauseBtn").addEventListener("click", () => { paused = !paused; render(); if (!paused && !busy) step(); });
  document.querySelectorAll(".modes button").forEach((b) => b.addEventListener("click", () => {
    const m = b.dataset.mode;
    if (m === "hvb") { $("p0").value = "human"; $("p1").value = "alphabeta"; }
    if (m === "bvb") { $("p0").value = "alphabeta"; $("p1").value = "mcts"; }
    if (m === "hvh") { $("p0").value = "human"; $("p1").value = "human"; }
    paused = false; newGame();
  }));
  $("preset").addEventListener("change", () => { $("customRow").hidden = $("preset").value !== "custom"; newGame(); });
  for (const id of ["rows", "cols", "nIn"]) $(id).addEventListener("change", newGame);
  for (const id of ["p0", "p1"]) $(id).addEventListener("change", () => { render(); if (!busy) step(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    const k = parseInt(e.key, 10);
    if (k >= 1 && k <= cfg.cols) humanMove(k - 1);
  });

  newGame();
})();
</script>
</body>
</html>
